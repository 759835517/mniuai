services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: mniu-ai-camp-postgres
    environment:
      POSTGRES_DB: mniu_ai_camp
      POSTGRES_USER: mniu
      POSTGRES_PASSWORD: 123456
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mniu -d mniu_ai_camp"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.2.5
    container_name: mniu-ai-camp-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  redis-data:
